<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kozmo — Kişisel gökyüzü rehberin</title>
    <meta name="description" content="Kozmo, doğum anındaki gökyüzünü gerçek astronomik hesapla okur ve sana her gün ilham veren kişisel bir yorum sunar." />

    <!-- PWA: kurulabilir uygulama -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a0b2e" />

    <!-- iOS: ana ekrana ekleme desteği -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kozmo" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      /* Service worker kaydı — çevrimdışı açılış ve ileride bildirimler.
         Yalnızca üretimde (https) çalışır; yerel geliştirmede sessiz geçer. */
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {
            /* kayıt başarısızsa uygulama yine normal çalışır */
          });
        });
      }
    </script>
  </body>
</html>
